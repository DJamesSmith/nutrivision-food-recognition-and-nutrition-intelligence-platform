{% extends "base.html" %}
{% block title %}NutriVision — Food Recognition{% endblock %}
{% block content %}
<div class="p-5 mb-4 bg-light rounded-3">
    <h1 class="display-6">NutriVision Food Recognition</h1>

</div>
{% endblock %}
